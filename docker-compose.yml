services:
  api:
    build: .
    container_name: schema-compat-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/schema_compat.db
    volumes:
      - schema_compat_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  schema_compat_data:
